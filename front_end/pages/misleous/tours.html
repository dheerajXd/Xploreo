<!DOCTYPE html>
<html>
    <head>
        <title>Tours</title>
        <link rel="stylesheet" href="../../css/shared.css">
        <link rel="stylesheet" href="../../css/tours.css">
        <link rel="stylesheet" href="../../css/tracking.css">
        <!-- Leaflet CSS -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    </head>
    <body>
        <div id="navbar"></div>
        <div id="main" class="page-wrapper">
            <div id="tour-page-header" class="welcome"></div>
            <div id="tours-internal-navbar" class="internal-navbar"></div>
            <div id="interal-search-bar"></div>
            <div id="internal-contents"></div>
        </div>

        <div id="tourModal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="close-btn" onclick="closeModal()">&times;</span>
                </div>
                <div id="modalBody" class="modal-body">
                    </div>
                <div class="modal-footer">
                    <button class="secondary-btn" onclick="closeModal()">Close</button>
                </div>
            </div>
        </div>

        <!-- Leaflet JS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <!-- Tracking JS -->
        <script src="../../js/tracking.js"></script>
        
        <script type="module" src="../../js/app.js"></script>
    </body>
</html>
