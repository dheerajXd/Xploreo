<!DOCTYPE html>
<html>
<head>
    <title>Services</title>
    <link rel="stylesheet" href="../../css/shared.css">
    <link rel="stylesheet" href="../../css/hotelstyle.css">
</head>

<body>

<div id="navbar"></div>

<main id="main" class="dashboard-wrapper">

    <!-- HEADER -->
    <div class="hotel-page-header hotel-flex-header">
        <div>
            <h1>Services</h1>
            <p>Manage your hotel offerings</p>
        </div>

        <button class="btn-blue" onclick="openServiceModal()">+ Add Service</button>
    </div>

    <!-- GRID -->
    <div id="service-grid"></div>

</main>

<div id="availability-modal" class="hotel-modal hidden">
  <div class="hotel-modal-content">

    <div class="hotel-modal-header">
      <h2 id="availabilityTitle">Manage Availability</h2>
      <span onclick="closeAvailabilityModal()">✕</span>
    </div>

    <div class="hotel-modal-body">

      <div class="form-group">
        <label>Total Rooms</label>
        <input type="number" id="totalRoomsInput" disabled />
      </div>

      <div class="form-group">
        <label>Available Rooms</label>
        <input type="number" id="availableRoomsInput" />
      </div>

      <div class="form-group">
        <label>Occupied Rooms</label>
        <input type="number" id="occupiedRoomsInput" disabled />
      </div>

    </div>

    <div class="hotel-modal-footer">
      <button class="btn-light" onclick="closeAvailabilityModal()">Cancel</button>
      <button class="btn-blue" onclick="saveAvailability()">Save</button>
    </div>

  </div>
</div>

<div id="add-service-modal" class="hotel-modal hidden">

  <div class="hotel-modal-box">

    <!-- HEADER -->
    <div class="hotel-modal-header">
      <h2>Add Service</h2>
      <span onclick="closeServiceModal()" class="close-btn">✕</span>
    </div>

    <!-- BODY -->
    <div class="hotel-modal-body">

      <!-- SECTION 1 -->
      <h3>Basic Details</h3>

      <label>Service Type</label>
      <input 
        id="serviceName" 
        type="text" 
        placeholder="Enter room type (e.g. Deluxe Room)" 
      />


      <div class="hotel-form-grid">
        <div>
          <label>Price per Night ($)</label>
          <input id="servicePrice" type="number" placeholder="120">
        </div>

        <div>
          <label>Capacity (guests)</label>
          <input id="serviceCapacity" type="number" placeholder="2">
        </div>
      </div>

      <label>Total Rooms</label>
      <input id="serviceTotal" type="number" placeholder="30">

      <!-- SECTION 2 -->
      <h3>Service Status</h3>

      <div class="hotel-status-toggle">
        <button id="statusActive" class="active" onclick="setStatus('active')">Active</button>
        <button id="statusInactive" onclick="setStatus('inactive')">Inactive</button>
      </div>

      <!-- SECTION 3 -->
      <h3>Images</h3>

      <div class="hotel-upload-box">
            <input type="file" id="imageInput" accept="image/*" hidden />
    
            <p>Drag & drop or click to upload</p>
            <button type="button" class="btn-blue" onclick="triggerImageUpload()">Upload Images</button>

            <div id="imagePreview" class="hotel-image-preview"></div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="hotel-modal-footer">
      <button class="btn-light" onclick="closeServiceModal()">Cancel</button>
      <button class="btn-gradient" onclick="saveService()">Save Service</button>
    </div>

  </div>
</div>

<script type="module" src="../../js/app.js"></script>

</body>
</html>
