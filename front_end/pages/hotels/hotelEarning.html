<!DOCTYPE html>
<html>
<head>
    <title>Hotel Earnings</title>
    <link rel="stylesheet" href="../../css/shared.css">
    <link rel="stylesheet" href="../../css/hotelstyle.css">
</head>
<body>

<div id="navbar"></div>

<main id="main" class="dashboard-wrapper">

    <!-- HEADER -->
    <div class="hotel-page-header">
        <h1>Earnings</h1>
        <p>Track your revenue and financial performance</p>
    </div>

    <!-- KPI -->
    <div id="earning-stats" class="hotel-stats-grid"></div>

    <!-- PERFORMANCE -->
    <div id="earning-performance"></div>

    <!-- REVENUE + REFUND -->
    <div class="hotel-split-grid">
        <div id="earning-revenue"></div>
        <div id="earning-refund"></div>
    </div>

    <!-- TRANSACTIONS -->
    <div id="earning-transactions"></div>

    <!-- PAYOUT -->
    <div id="earning-payout"></div>

</main>

<script type="module" src="../../js/app.js"></script>

</body>
</html>
