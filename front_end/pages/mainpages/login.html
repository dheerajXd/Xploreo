<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../css/landing.css">
<link rel="stylesheet" href="../../css/login.css">

</head>

<body>

<div id = "navbar" ></div>

<section class="hero">

    <video
        autoplay
        muted
        loop
        class="hero-bg"
    >

        <source
            src="../../components/ui/landing/beach.mp4"
            type="video/mp4"
        >

    </video>

    <div class="login-hero-content">

        <h1>
            Join Xploreo
        </h1>

        <p>
            Start your journey
        </p>

    </div>

</section>

<!-- LOGIN CARD -->

<section class="login-section">

<div class="login-card">

    <h2 class="welcome-text">
        Welcome
    </h2>

    <form id="login-form">

        <div class="form-group">

            <label>
                Username or Email
            </label>

            <input
                type="text"
                id="login-username"
                placeholder=""
                required
            >

        </div>

        <div class="form-group">

            <label>
                Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="login-password"
                    placeholder=""
                    required
                >

                <span
                    class="toggle-password"
                    id="toggle-password"
                >

                    <img src="../../components/ui/eye-closed.svg" alt="Toggle Password" style="width: 20px; height: 20px;">

            </div>

        </div>

        <a
            href="#"
            class="forgot-link"
        >
            Forgot Password?
        </a>

        <button
            type="submit"
            class="form-submit-btn"
        >

            Log in →

        </button>

    </form>

</div>

</section>
<!-- FORGOT PASSWORD MODAL -->
<div id="forgot-password-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <span class="close-modal" id="close-forgot-modal">&times;</span>
        <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; margin-bottom: 20px; color: #0F4C4C;">Reset Password</h2>
        
        <div id="forgot-step-1">
            <p style="font-family: 'Montserrat', sans-serif; font-size: 14px; margin-bottom: 10px; color: #1F2937;">Enter your username or email address:</p>
            <input type="text" id="forgot-identifier" class="modal-input" placeholder="Username or Email">
            <button id="forgot-verify-btn" class="modal-btn">Verify Account</button>
            <p id="forgot-error-1" class="modal-error" style="color: #EF4444; font-size: 12px; display: none; margin-top: 10px;"></p>
        </div>

        <div id="forgot-step-2" class="hidden">
            <p style="font-family: 'Montserrat', sans-serif; font-size: 14px; margin-bottom: 10px; color: #1F2937;">Account found! Enter your new password:</p>
            <input type="password" id="forgot-new-password" class="modal-input" placeholder="New Password">
            <button id="forgot-reset-btn" class="modal-btn">Reset Password</button>
            <p id="forgot-error-2" class="modal-error" style="color: #EF4444; font-size: 12px; display: none; margin-top: 10px;"></p>
        </div>
        
        <div id="forgot-step-3" class="hidden" style="text-align: center;">
            <p style="font-family: 'Montserrat', sans-serif; font-size: 16px; margin-bottom: 20px; color: #10B981; font-weight: bold;">Password successfully reset!</p>
            <button id="forgot-close-btn" class="modal-btn">Back to Login</button>
        </div>
    </div>
</div>

<script type="module" src="../../js/app.js"></script>

</body>

</html>
